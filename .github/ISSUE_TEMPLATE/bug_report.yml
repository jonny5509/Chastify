name: Bug Report
description: Report a reproducible problem with the integration.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce the problem.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: Tell us what you observed and what you expected instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Integration version
      description: Which integration version are you using?
      placeholder: "1.3.8"
    validations:
      required: true

  - type: input
    id: home-assistant-version
    attributes:
      label: Home Assistant version
      description: Which Home Assistant version are you running?
      placeholder: "2026.9.x"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include relevant Home Assistant logs or error messages. Remove sensitive information.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add screenshots, configuration details, or anything else that may help.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have removed passwords, tokens, personal information, and other sensitive data from this report.
          required: true
        - label: I have read and agree to follow the project's Code of Conduct.
          required: true
